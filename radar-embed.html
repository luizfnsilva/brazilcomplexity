<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Perene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body style="margin:0;background:#06121c">
<div class="mp" id="mp">
  <style>
    .mp{--bg:#06121c;--card:#0e2030;--card2:#13263a;--line:#1e3340;--txt:#f5f3ef;--dim:#8ba3a0;
      --accent:#a89a78;--hot:#c97a5a;--warm:#c9a86a;--cool:#4a7c6f;--neu:#5a6b72;
      --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg);color:var(--txt);font-family:var(--font);max-width:860px;margin:0 auto;padding:24px;line-height:1.45}
    .mp h2{font-family:'Fraunces',serif;font-size:21px;margin:0 0 2px;font-weight:500;letter-spacing:-.01em;color:#fff}
    .mp h3{font-family:'DM Mono',monospace;font-size:10px;margin:20px 0 9px;color:var(--dim);text-transform:uppercase;letter-spacing:.18em;font-weight:500}
    .mp .sub{color:var(--dim);font-size:12px;line-height:1.5}
    .mp .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media(max-width:640px){.mp .grid{grid-template-columns:1fr 1fr}}
    .mp .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:13px}
    .mp .k{font-size:11px;color:var(--dim)}
    .mp .big{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin-top:3px;color:#f5f3ef}
    .mp .reg{font-size:11px;font-weight:400;margin-top:3px}
    .mp .t{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--neu);border-radius:4px;padding:10px 11px}
    .mp .t .nm{font-size:12px;font-weight:500;color:#e6ebe9}
    .mp .t .vl{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#fff}
    .mp .t .rg{font-size:10.5px;color:var(--dim)}
    .mp .chip{display:inline-flex;gap:5px;align-items:baseline;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;margin:0 5px 6px 0}
    .mp .chip b{font-weight:600;color:#f5f3ef;font-family:'DM Mono',monospace}
    .mp .chip .u{color:var(--dim);font-size:10px}
    .mp .hl{background:linear-gradient(180deg,#13263a,#0e2030);border:1px solid var(--accent);border-radius:4px;padding:16px}
    .mp .hl .q{font-size:13px;color:var(--dim);margin-bottom:10px;line-height:1.5}
    .mp .hl .stat{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline}
    .mp .hl .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--accent)}
    .mp .hl .d{font-size:12.5px}
    .mp ul.dv{margin:6px 0 0;padding:0;list-style:none}
    .mp ul.dv li{font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);color:var(--dim)}
    .mp ul.dv li b{color:var(--accent);font-family:'DM Mono',monospace}
    .mp .hip{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:13px;font-size:12.5px;line-height:1.55;color:#cdd6d4}
    .mp .hip .ec{color:var(--dim);margin-top:8px}
    .mp .hip .ec b{color:var(--accent)}
    .mp .prem{margin-top:20px;background:var(--card);border:1px dashed var(--line);border-radius:4px;padding:15px}
    .mp .prem .pt{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
    .mp .prem ul{margin:9px 0 0;padding-left:16px;color:var(--dim);font-size:12px}
    .mp .prem ul li{margin:4px 0}
    .mp .cta{display:block;text-align:center;margin-top:16px;background:var(--accent);color:#06121c;text-decoration:none;font-family:'DM Mono',monospace;font-weight:500;padding:14px;border-radius:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:opacity .2s}
    .mp .cta:hover{opacity:.88}
    .mp .disc{color:var(--dim);font-size:10.5px;margin-top:13px;text-align:center;line-height:1.5}
    .mp .hot{border-left-color:var(--hot)}.mp .warm{border-left-color:var(--warm)}.mp .cool{border-left-color:var(--cool)}.mp .lo{color:var(--dim)}
  </style>
  <h2>Radar Perene</h2>
  <div class="sub" id="mp-intro">…</div><div id="mp-body"></div>
  <a class="cta" id="mp-cta" href="#" rel="nofollow noopener">…</a><div class="disc" id="mp-disc"></div>
</div>
<script>
(function(){
  var BASE="https://zcjtkgltrxdnlacezpny.supabase.co/functions/v1/radar-api";
  var LANG=(new URLSearchParams(location.search).get("lang")==="pt")?"pt":"en";
  var T=LANG==="en"?{intro:"In-house regime-reading instrument for Brazil. As of",regime:"Today's regime",macro:"Essential macro (public data)",term:"9 thermometers (Vertice)",analog:"Analog study",div:"Divergences today",extras:"Breadth / geographic / judicial",hip:"How the engine reasons (sample hypothesis)",contra:"Contradiction",cta:"Get history & alerts - notify me at launch",br:"Brazil",gl:"Global",inter:"BR intermarket",bus:"US breadth",bbr:"BR breadth",geo:"Geographic risk-on",jud:"Judicial highlight",medianN:"median",vsbase:"vs base",hit:"hit-rate"}:{intro:"Instrumento in-house de leitura do regime regulatorio e de mercado do Brasil. Referencia de",regime:"Regime de hoje",macro:"Macro essencial (dado publico)",term:"9 termometros (Vertice)",analog:"Estudo de analogo",div:"Divergencias detectadas hoje",extras:"Breadth / geografico / judicial",hip:"Como o cerebro raciocina (hipotese exemplo)",contra:"Contradicao",cta:"Quero historico e alertas - me avise no lancamento",br:"Brasil",gl:"Global",inter:"BR intermercado",bus:"Breadth US",bbr:"Breadth BR",geo:"Risk-on geografico",jud:"Destaque judicial",medianN:"mediana",vsbase:"vs base",hit:"hit-rate"};
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  function cls(v){if(v==null)return "";return v>=75?"hot":v>=55?"warm":v<=45?"cool":""}
  function card(k,score,reg){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="big">'+(score==null?"-":esc(score))+'</div><div class="reg lo">'+esc(reg)+'</div></div>'}
  var u="hello",dom="brazilcomplexity"+"."+"com",c=el("mp-cta");if(c)c.setAttribute("href","mailto:"+u+"@"+dom+"?subject="+encodeURIComponent("Radar Perene - early access"));
  fetch(BASE+"/v1/digest?lang="+LANG).then(function(r){return r.json()}).then(function(d){
    el("mp-cta").textContent=T.cta;var rr=d.radar||{},v=d.vertice||{},h="";
    el("mp-intro").textContent=T.intro+" "+(d.data_referencia||"-")+".";
    if(rr.regime){var g=rr.regime;h+='<h3>'+T.regime+'</h3><div class="grid">'+card(T.br,(g.brasil||{}).score,(g.brasil||{}).regime)+card(T.gl,(g.global||{}).score,(g.global||{}).regime)+card(T.inter,(g.br_intermercado||{}).score,(g.br_intermercado||{}).regime)+'</div>';}
    if(rr.macro_essencial&&rr.macro_essencial.length){h+='<h3>'+T.macro+'</h3><div>'+rr.macro_essencial.map(function(m){return '<span class="chip"><b>'+esc(m.valor)+'</b> <span class="u">'+esc(m.unidade)+'</span> '+esc(m.nome)+'</span>'}).join("")+'</div>';}
    if(v.termometros){h+='<h3>'+T.term+'</h3><div class="grid">'+v.termometros.map(function(t){return '<div class="t '+cls(t.valor)+'"><div class="nm">'+esc(t.nome)+'</div><div class="vl">'+(t.valor==null?'-':esc(t.valor))+'</div><div class="rg">'+esc(t.regime)+'</div></div>'}).join("")+'</div>';}
    if(v.estudo_analogo){var a=v.estudo_analogo;h+='<h3>'+T.analog+'</h3><div class="hl"><div class="q">'+esc(a.pergunta)+'</div><div class="stat"><div><div class="v">'+esc(a.mediana_ret_pct)+'%</div><div class="d lo">'+T.medianN+' ('+esc(a.n_analogos)+')</div></div><div><div class="v">'+(a.delta_pp>=0?'+':'')+esc(a.delta_pp)+'pp</div><div class="d lo">'+T.vsbase+' '+esc(a.base_rate_pct)+'%</div></div><div><div class="v">'+esc(a.hit_rate_pct)+'%</div><div class="d lo">'+T.hit+'</div></div></div><div class="sub" style="margin-top:8px">'+esc(a.leitura)+'</div></div>';}
    if(v.divergencias&&v.divergencias.length){h+='<h3>'+T.div+'</h3><ul class="dv">'+v.divergencias.map(function(x){return '<li><b>'+esc(x.codigo)+'</b> - '+esc(x.leitura)+'</li>'}).join("")+'</ul>';}
    var ex=[];if(v.breadth){if(v.breadth.us)ex.push(card(T.bus,v.breadth.us.valor+'%',v.breadth.us.regime));if(v.breadth.br)ex.push(card(T.bbr,v.breadth.br.valor+'%',v.breadth.br.regime));}if(v.geo_riskon)ex.push(card(T.geo,v.geo_riskon.valor,v.geo_riskon.regime));if(rr.contexto_judicial&&rr.contexto_judicial.destaque){var j=rr.contexto_judicial.destaque;ex.push(card(T.jud+': '+esc(j.gaveta),j.z,j.tema));}
    if(ex.length){h+='<h3>'+T.extras+'</h3><div class="grid">'+ex.join("")+'</div>';}
    if(v.hipotese_exemplo&&v.hipotese_exemplo.hipotese){var hp=v.hipotese_exemplo;h+='<h3>'+T.hip+'</h3><div class="hip">'+esc(hp.hipotese)+'<div class="ec"><b>'+T.contra+':</b> '+esc(hp.evidencia_contra)+'</div></div>';}
    if(d.premium){h+='<div class="prem"><div class="pt">'+esc(d.premium.titulo)+'</div><ul>'+(d.premium.itens||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>';}
    el("mp-body").innerHTML=h;if(d.disclaimer)el("mp-disc").textContent=d.disclaimer[LANG]||d.disclaimer.en||d.disclaimer.pt;
  }).catch(function(e){el("mp-body").innerHTML='<div class="sub">unavailable.</div>'});
})();
</script>
</body></html>
